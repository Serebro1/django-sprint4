{% load static %}
<header>
  <nav class="navbar navbar-light" style="background-color: lightskyblue">
    <div class="container">
      <a class="navbar-brand" href="{% url 'blog:index' %}">
        <img src="{% static 'img/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="">
        Блогикум
      </a>
      {% with request.resolver_match.view_name as view_name %}
        <ul class="nav  nav-pills">
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'pages:about' %} text-white {% endif %}" href="{% url 'pages:about' %}">
              О проекте
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'pages:rules' %} text-white {% endif %}" href="{% url 'pages:rules' %}">
              Правила
            </a>
          </li>
          {% if user.is_authenticated %}
            <div class="d-flex">
              <a class="btn btn-outline-primary rounded-start rounded-0"
                href="{% url 'blog:create_post' %}">Написать пост</a>

              <a class="btn btn-outline-primary rounded-0 ms-n1"
                href="{% url 'blog:profile' user.username %}">{{ user.username }}</a>

              <form method="post" action="{% url 'logout' %}" class="d-flex ms-n1">
                {% csrf_token %}
                <button type="submit"
                        class="btn btn-outline-primary rounded-end rounded-0 ">Выйти</button>
              </form>
            </div>
          {% else %}
            <div class="d-flex">
              <a class="btn btn-outline-primary rounded-start rounded-0"
                href="{% url 'login' %}">Войти</a>

              <a class="btn btn-outline-primary rounded-end rounded-0 ms-n1"
                href="{% url 'registration' %}">Регистрация</a>
            </div>
          {% endif %}
        </ul>
      {% endwith %}
    </div>
  </nav>
</header>
